<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Astraea Studio</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #07091d 0%, #050810 50%, #030611 100%);
        color: #f8f4ff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .mark {
        font-size: 40px;
        color: #d8ba74;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 24px;
        font-weight: 600;
        margin: 0 0 12px;
      }
      p {
        color: rgba(255, 255, 255, 0.6);
        line-height: 1.7;
        max-width: 320px;
        margin: 0 auto 24px;
      }
      button {
        font: inherit;
        border: 0;
        border-radius: 999px;
        padding: 12px 28px;
        font-weight: 600;
        color: #050810;
        background: linear-gradient(90deg, #ded0ff, #ffffff);
      }
    </style>
  </head>
  <body>
    <div>
      <div class="mark">&#10022;</div>
      <h1>You're offline</h1>
      <p>Astraea needs a connection to read your chart. Reconnect and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
